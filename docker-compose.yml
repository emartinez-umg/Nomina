services:
  nomina:
    image: ${ORACLE_IMAGE:-container-registry.oracle.com/database/express:21.3.0-xe}
    platform: linux/amd64
    container_name: nomina
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Configura ORACLE_PWD en .env}
      ORACLE_CHARACTERSET: AL32UTF8
      NOM_DB_USER: ${NOM_DB_USER:-ERP_NOMINA}
      NOM_DB_PASSWORD: ${NOM_DB_PASSWORD:?Configura NOM_DB_PASSWORD en .env}
    ports:
      - '127.0.0.1:1521:1521'
    shm_size: '1gb'
    volumes:
      - nomina_data:/opt/oracle/oradata
      - ./db:/opt/nomina:ro
      - ./db/startup:/opt/oracle/scripts/startup:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -f /opt/oracle/oradata/.nomina-initialized && /opt/oracle/checkDBStatus.sh',
        ]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s
volumes:
  nomina_data:
